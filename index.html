<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>SkyCast | Weather, made clear</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="topbar"><a class="brand" href="#"><span class="brand-mark">☼</span><span>skycast<span class="brand-dot">.</span></span></a><div class="top-note"><span class="live-dot"></span> LIVE WEATHER</div></header>
<section class="intro"><p class="eyebrow">YOUR DAY, FORECAST</p><h1>Weather, <span>made clear.</span></h1><p class="subhead">A little more prepared for whatever's outside.</p></section>
<form id="search-form" class="search-bar"><span class="search-icon">⌕</span><label class="sr-only" for="city-input">Search city</label><input id="city-input" type="text" placeholder="Search a city… e.g. Mysuru" autocomplete="off" value="Mysuru"><button id="search-button" type="submit">Search ↗</button></form>
<div class="search-meta"><span id="status" role="status">Getting the latest forecast…</span><button id="unit-toggle" class="unit-toggle" type="button">°C <span>/</span> °F</button></div>
<section id="weather-content" class="weather-content" aria-live="polite"><div class="loading-card"><div class="spinner"></div><p>Looking outside for you…</p></div></section>
<footer><span>Made for curious minds.</span><span>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></span></footer></main><script src="app.js"></script></body></html>
